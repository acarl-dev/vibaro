services:
  db:
    image: postgres:16
    container_name: vibaro-db
    environment:
      POSTGRES_DB: vibaro
      POSTGRES_USER: vibaro
      POSTGRES_PASSWORD: vibaro
    ports:
      - "5432:5432"
    volumes:
      - vibaro_db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: vibaro-redis
    ports:
      - "6379:6379"

  mailhog:
    image: mailhog/mailhog
    container_name: vibaro-mailhog
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP

volumes:
  vibaro_db_data:
